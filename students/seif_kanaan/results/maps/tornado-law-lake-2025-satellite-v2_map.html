                var html_353db071f72c40bf18bbc5436bf940f3 = $(`<div id="html_353db071f72c40bf18bbc5436bf940f3" style="width: 100.0%; height: 100.0%;"><b>Law Lake tornado: Sentinel-2 canopy change (revised baseline)</b><p>Sentinel-2 before/after composites show spectral change near the documented 2025 Law Lake tornado. A dual-index rule marks AOI-wide exploratory canopy-change candidates, including scattered changes away from the documented event corridor. The widened 42-day baseline, seasonal change and possible residual haze/colour or contrast differences limit attribution; this is not a complete tornado footprint.</p><b>Interpretation limits</b><ul><li>Exploratory satellite observations, not independently validated damage, an official affected-area total or an emergency warning. Blank/excluded pixels are unknown, not unchanged.</li><li>Shared observations cover 93.14% of the box; baseline mapped-forest coverage is 93.22%, and shared coverage of the NDVI-qualified eligible population is 99.995%. Unobserved or excluded land is unknown, not undamaged.</li><li>The 42-day baseline mixes earlier summer conditions with a 21-day comparison; broad NDVI shifts and possible residual haze/colour or contrast differences limit interpretation. 65.76% of candidate area relies on the added earlier baseline (34.24% also has qualified original-window support). Nine-threshold candidate sensitivity is 17.1–248.0 ha, not a confidence interval.</li><li>The original baseline failed. V2 revised dates once using coverage diagnostics only; its quality/count/coverage/index thresholds were retained. Source history is preserved rather than re-labelled as approved.</li><li>This is satellite-observed spectral change near a documented tornado, not confirmed canopy-loss fraction, treefall, structural damage, wind speed or EF severity.</li><li>NDVI/NBR thresholds are predeclared exploratory diagnostics, not scientifically calibrated damage classes. Report all nine sensitivity combinations; never tune to NTP agreement.</li><li>2021 WorldCover tree cover can be stale or misclassified in 2025. The baseline NDVI criterion limits the study population, not all forest or all tornado-affected land.</li><li>The revised June 15–July 26 42-day baseline is farther from the event and asymmetric with the 21-day comparison. Phenology/leaf development, moisture, illumination, logging, other wind, fire and cloud/shadow can cause change; this is a stronger temporal confound than the failed original 21-day baseline.</li><li>Each 20 m cell mixes vegetation and surroundings. RGB/indices are medians of daily observations, not a simultaneous photograph; per-pixel first/last contributing dates and distinct clear-date counts are retained.</li><li>The original July 6–26 baseline failed its unchanged 80% mapped-forest coverage requirement (35.959%). V2 is an explicitly documented one-time baseline revision; quality/count/coverage/indicator thresholds are unchanged, and no search or automatic relaxation occurs.</li><li>Unobserved or ineligible land is not unchanged or undamaged. Two clear-date and two coverage gates still fail closed; original-window count/support rasters and per-date forest coverage are diagnostic, not evidence that V2 succeeds.</li><li>NTP independently documents the event using satellite review including Sentinel imagery. It is contextual corroboration of observability, not independent pixel-level validation of this experiment.</li><li>As checked 22 October 2026, NTP&#x27;s current public Damage Tracks service does not contain a full Law Lake line. Do not synthesize a line or footprint from published start/end coordinates, maximum width or a map image.</li></ul><b>Sources and credits</b><ul><li><a href="https://www.uwo.ca/ntp/blog/2025/ontarios_first_ef2_tornado_recorded_in_nw_on_on_jul_27.html" target="_blank" rel="noopener noreferrer">NTP event assessment and explicit Sentinel-2 observability evidence</a><br>NTP event assessment and explicit Sentinel-2 observability evidence<br>Linked primary-source context/documentation; original terms apply. No source illustrations or survey geometry are redistributed.</li><li><a href="https://developers.google.com/earth-engine/datasets/catalog/COPERNICUS_S2_SR_HARMONIZED" target="_blank" rel="noopener noreferrer">Sentinel-2 harmonized surface reflectance</a><br>Sentinel-2 harmonized surface reflectance<br>Linked primary-source context/documentation; original terms apply. No source illustrations or survey geometry are redistributed.</li><li><a href="https://developers.google.com/earth-engine/datasets/catalog/GOOGLE_CLOUD_SCORE_PLUS_V1_S2_HARMONIZED" target="_blank" rel="noopener noreferrer">Cloud Score+ quality data</a><br>Google Earth Engine, Cloud Score+; Pasquarella et al. (2023), doi:10.1109/CVPRW59228.2023.00206<br>CC BY 4.0</li><li><a href="https://developers.google.com/earth-engine/datasets/catalog/ESA_WorldCover_v200" target="_blank" rel="noopener noreferrer">ESA WorldCover 2021 v200 baseline land cover</a><br>ESA WorldCover 2021 / Contains modified Copernicus Sentinel data (2021) processed by ESA WorldCover Consortium; Zanaga et al. (2022), doi:10.5281/zenodo.7254221<br>CC BY 4.0</li><li><a href="https://doi.org/10.1175/JAMC-D-16-0228.1" target="_blank" rel="noopener noreferrer">Kingfield and de Beurs (2017): tornado spectral response and land-cover/season limitations</a><br>Kingfield and de Beurs (2017): tornado spectral response and land-cover/season limitations<br>Linked primary-source context/documentation; original terms apply. No source illustrations or survey geometry are redistributed.</li><li><a href="https://developers.google.com/earth-engine/datasets/catalog/ESA_WorldCover_v200" target="_blank" rel="noopener noreferrer">Satellite and baseline attribution</a><br>Contains modified Copernicus Sentinel data (2025). ESA WorldCover 2021 / Contains modified Copernicus Sentinel data (2021) processed by ESA WorldCover Consortium; Zanaga et al. (2022), doi:10.5281/zenodo.7254221.<br>Sentinel observations: Copernicus Sentinel data terms; ESA WorldCover: CC BY 4.0. NTP is linked contextual event evidence; no NTP survey geometry is redistributed.</li></ul></div>`)[0];
